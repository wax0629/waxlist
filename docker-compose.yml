# Local Postgres for Waxlist community features (P1).
# Usage: docker compose up -d
# Connection: postgresql://waxlist:waxlist@localhost:5432/waxlist

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: waxlist
      POSTGRES_PASSWORD: waxlist
      POSTGRES_DB: waxlist
    volumes:
      - waxlist_pg_data:/var/lib/postgresql/data

volumes:
  waxlist_pg_data:
